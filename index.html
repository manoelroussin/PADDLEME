<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PADDLEME</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --accent-color: #00ffcc;
      --text-color: #f0f6fc;
      --subtext-color: #8b949e;
      --danger-color: #ff4d4d;
    }
    body {
      margin: 0;
      padding: 10px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      user-select: none;
    }
    h1 { margin: 5px 0 10px; color: var(--accent-color); letter-spacing: 2px; font-size: 1.4rem; }
    
    /* Grilles compactes */
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 8px 5px;
      border: 1px solid #30363d;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .card:active {
      border-color: var(--accent-color);
    }
    
    .value-small {
      font-size: 1.7rem;
      font-weight: bold;
      color: var(--accent-color);
      line-height: 1.1;
    }
    
    .value-time {
      font-size: 1.5rem;
      font-weight: bold;
      color: #fff;
      line-height: 1.2;
      font-family: monospace;
    }

    .unit { font-size: 0.72rem; color: var(--subtext-color); font-weight: 600; }
    
    /* Jauges sous les cartes */
    .gauge-container {
      width: 100%;
      height: 6px;
      background-color: #21262d;
      border-radius: 3px;
      margin-top: 6px;
      overflow: hidden;
    }
    
    .gauge-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00ffcc, #ffab00, #ff4d4d);
      transition: width 0.3s ease;
      border-radius: 3px;
    }

    /* Modale de réglage Min/Max */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #30363d;
      width: 80%;
      max-width: 300px;
      text-align: left;
    }

    .modal-content h3 { margin-top: 0; color: var(--accent-color); font-size: 1.1rem; }
    .modal-content label { display: block; margin: 10px 0 4px; font-size: 0.9rem; }
    .modal-content input[type=number] {
      width: 100%;
      padding: 8px;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #fff;
      border-radius: 6px;
      box-sizing: border-box;
    }

    /* Container du graphique */
    .chart-container {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 8px;
      border: 1px solid #30363d;
      margin-bottom: 8px;
      height: 130px;
      position: relative;
    }
    
    .controls {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 10px;
      border: 1px solid #30363d;
      margin-bottom: 10px;
      text-align: left;
    }
    
    .slider-group { margin-bottom: 8px; }
    label { display: block; margin-bottom: 2px; font-size: 0.8rem; }
    input[type=range] { width: 100%; accent-color: var(--accent-color); }
    
    .btn-group {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    button {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      background-color: var(--accent-color);
      color: #000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    
    .btn-lap { background-color: #388bfd; color: #fff; }
    .btn-modal { margin-top: 15px; padding: 10px; font-size: 0.9rem; }

    button:active { opacity: 0.8; }
  </style>
</head>
<body>

  <h1>PADDLEME</h1>

  <!-- Top métriques : Cadence, Intensité, Coups -->
  <div class="grid-3">
    <div class="card" onclick="openConfig('spm', 'Cadence (SPM)')">
      <div class="unit">CADENCE</div>
      <div id="spmDisplay" class="value-small">0</div>
      <div class="unit">SPM</div>
      <div class="gauge-container"><div id="spmGauge" class="gauge-bar"></div></div>
    </div>

    <div class="card" onclick="openConfig('intensity', 'Intensité (m/s²)')">
      <div class="unit">INTENSITÉ</div>
      <div id="intensityDisplay" class="value-small">0.0</div>
      <div class="unit">m/s²</div>
      <div class="gauge-container"><div id="intensityGauge" class="gauge-bar"></div></div>
    </div>

    <div class="card" style="cursor: default;">
      <div class="unit">COUPS</div>
      <div id="countDisplay" class="value-small">0</div>
      <div class="unit">total</div>
    </div>
  </div>

  <!-- Vitesses GPS -->
  <div class="grid-2">
    <div class="card" onclick="openConfig('speedInst', 'Vitesse Inst. (km/h)')">
      <div class="unit">VITESSE INST.</div>
      <div id="speedInstDisplay" class="value-small">0.0</div>
      <div class="unit">km/h</div>
      <div class="gauge-container"><div id="speedInstGauge" class="gauge-bar"></div></div>
    </div>

    <div class="card" onclick="openConfig('speedAvg', 'Vit. Moyenne (km/h)')">
      <div class="unit">VIT. MOY. (ACTIF)</div>
      <div id="speedAvgDisplay" class="value-small">0.0</div>
      <div class="unit">km/h</div>
      <div class="gauge-container"><div id="speedAvgGauge" class="gauge-bar"></div></div>
    </div>
  </div>

  <!-- Chronos -->
  <div class="grid-2">
    <div class="card" style="cursor: default;">
      <div class="unit">TEMPS ACTIF</div>
      <div id="activeTimeDisplay" class="value-time">00:00</div>
      <div class="unit">sans pauses</div>
    </div>
    <div class="card" style="cursor: default;">
      <div class="unit">CHRONO LAP</div>
      <div id="lapTimeDisplay" class="value-time">00:00</div>
      <div class="unit">tour en cours</div>
    </div>
  </div>

  <!-- Graphique d'accélération en direct -->
  <div class="chart-container">
    <canvas id="accChart"></canvas>
  </div>

  <div class="btn-group">
    <button id="lapBtn" class="btn-lap">Nouveau LAP (Reset)</button>
  </div>

  <div class="controls">
    <div class="slider-group">
      <label for="threshold">Seuil d'accélération : <b id="thresholdVal">3.0</b> m/s²</label>
      <input type="range" id="threshold" min="1.0" max="8.0" step="0.2" value="3.0">
    </div>

    <div class="slider-group" style="margin: 0;">
      <label for="interval">Délai min entre coups : <b id="intervalVal">800</b> ms</label>
      <input type="range" id="interval" min="400" max="1500" step="50" value="800">
    </div>
  </div>

  <button id="startBtn">DÉMARRER LA SESSION</button>

  <!-- Modale de réglage Min/Max -->
  <div id="configModal" class="modal">
    <div class="modal-content">
      <h3 id="modalTitle">Réglage Jauge</h3>
      <label for="minVal">Valeur Minimum :</label>
      <input type="number" id="minVal" step="0.1">

      <label for="maxVal">Valeur Maximum :</label>
      <input type="number" id="maxVal" step="0.1">

      <button onclick="saveConfig()" class="btn-modal">Valider</button>
    </div>
  </div>

  <script>
    let isRunning = false;
    let strokeCount = 0;
    let lastStrokeTime = 0;
    let threshold = 3.0;
    let minInterval = 800;
    let wakeLock = null;

    // Horloges
    let activeTimeSeconds = 0;
    let lapTimeSeconds = 0;
    let activeTimer = null;
    let strokeTimeout = null;
    let isPaddling = false;

    // GPS & Vitesses
    let watchId = null;
    let activeSpeedSum = 0;
    let activeSpeedCount = 0;

    // Graphique Chart.js
    let chart;
    const maxDataPoints = 50;

    // Configuration des Min/Max pour les jauges
    const gaugeLimits = {
      spm: { min: 30, max: 90 },
      intensity: { min: 2, max: 8 },
      speedInst: { min: 0, max: 15 },
      speedAvg: { min: 0, max: 12 }
    };

    let currentConfigKey = null;

    function openConfig(key, title) {
      currentConfigKey = key;
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('minVal').value = gaugeLimits[key].min;
      document.getElementById('maxVal').value = gaugeLimits[key].max;
      document.getElementById('configModal').style.display = 'flex';
    }

    function saveConfig() {
      if (currentConfigKey) {
        const min = parseFloat(document.getElementById('minVal').value);
        const max = parseFloat(document.getElementById('maxVal').value);

        if (!isNaN(min) && !isNaN(max) && max > min) {
          gaugeLimits[currentConfigKey].min = min;
          gaugeLimits[currentConfigKey].max = max;
        }
      }
      document.getElementById('configModal').style.display = 'none';
    }

    function updateGauge(gaugeId, value, min, max) {
      const percentage = Math.min(Math.max(((value - min) / (max - min)) * 100, 0), 100);
      document.getElementById(gaugeId).style.width = percentage + '%';
    }

    function initChart() {
      const ctx = document.getElementById('accChart').getContext('2d');
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: Array(maxDataPoints).fill(''),
          datasets: [{
            label: 'Accélération (m/s²)',
            data: Array(maxDataPoints).fill(0),
            borderColor: '#00ffcc',
            borderWidth: 2,
            pointRadius: 0,
            fill: false,
            tension: 0.2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          scales: {
            x: { display: false },
            y: {
              min: 0,
              max: 10,
              grid: { color: '#30363d' },
              ticks: { color: '#8b949e', font: { size: 9 } }
            }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

    function updateChart(value) {
      if (!chart) return;
      chart.data.datasets[0].data.push(value);
      chart.data.datasets[0].data.shift();
      chart.update('none');
    }

    document.getElementById('threshold').addEventListener('input', (e) => {
      threshold = parseFloat(e.target.value);
      document.getElementById('thresholdVal').innerText = threshold.toFixed(1);
    });

    document.getElementById('interval').addEventListener('input', (e) => {
      minInterval = parseInt(e.target.value);
      document.getElementById('intervalVal').innerText = minInterval;
    });

    document.getElementById('lapBtn').addEventListener('click', () => {
      lapTimeSeconds = 0;
      updateTimeDisplays();
    });

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateTimeDisplays() {
      document.getElementById('activeTimeDisplay').innerText = formatTime(activeTimeSeconds);
      document.getElementById('lapTimeDisplay').innerText = formatTime(lapTimeSeconds);
    }

    function startActiveTimer() {
      if (!activeTimer) {
        activeTimer = setInterval(() => {
          if (isPaddling) {
            activeTimeSeconds++;
            lapTimeSeconds++;
            updateTimeDisplays();
          }
        }, 1000);
      }
    }

    function stopActiveTimer() {
      if (activeTimer) {
        clearInterval(activeTimer);
        activeTimer = null;
      }
    }

    function handleGpsPosition(pos) {
      if (!pos.coords || pos.coords.speed === null || pos.coords.speed === undefined) return;

      const speedKmH = Math.max(0, pos.coords.speed * 3.6);
      document.getElementById('speedInstDisplay').innerText = speedKmH.toFixed(1);
      updateGauge('speedInstGauge', speedKmH, gaugeLimits.speedInst.min, gaugeLimits.speedInst.max);

      if (isPaddling) {
        activeSpeedSum += speedKmH;
        activeSpeedCount++;
        const avgSpeed = activeSpeedSum / activeSpeedCount;
        document.getElementById('speedAvgDisplay').innerText = avgSpeed.toFixed(1);
        updateGauge('speedAvgGauge', avgSpeed, gaugeLimits.speedAvg.min, gaugeLimits.speedAvg.max);
      }
    }

    document.getElementById('startBtn').addEventListener('click', async () => {
      if (!isRunning) {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
          const permission = await DeviceMotionEvent.requestPermission();
          if (permission !== 'granted') {
            alert('Accès aux capteurs refusé');
            return;
          }
        }

        window.addEventListener('devicemotion', handleMotion);
        
        if ('geolocation' in navigator) {
          watchId = navigator.geolocation.watchPosition(
            handleGpsPosition, 
            (err) => console.log(err), 
            { enableHighAccuracy: true, maximumAge: 1000 }
          );
        }

        startActiveTimer();
        
        if ('wakeLock' in navigator) {
          try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
        }

        isRunning = true;
        document.getElementById('startBtn').innerText = 'PAUSER SESSION';
        document.getElementById('startBtn').style.backgroundColor = 'var(--danger-color)';
      } else {
        window.removeEventListener('devicemotion', handleMotion);
        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
        }
        stopActiveTimer();
        if (wakeLock) { wakeLock.release(); wakeLock = null; }
        isRunning = false;
        isPaddling = false;
        document.getElementById('startBtn').innerText = 'REPRENDRE LA SESSION';
        document.getElementById('startBtn').style.backgroundColor = 'var(--accent-color)';
      }
    });

    function handleMotion(event) {
      const acc = event.acceleration || event.accelerationIncludingGravity;
      if (!acc) return;

      const accZ = Math.abs(acc.z || 0);
      const accY = Math.abs(acc.y || 0);
      const currentAcc = Math.max(accZ, accY);

      updateChart(currentAcc);

      const currentTime = Date.now();

      if (currentAcc > threshold) {
        const timeDiff = currentTime - lastStrokeTime;

        if (timeDiff > minInterval) {
          strokeCount++;
          document.getElementById('countDisplay').innerText = strokeCount;
          document.getElementById('intensityDisplay').innerText = currentAcc.toFixed(1);
          updateGauge('intensityGauge', currentAcc, gaugeLimits.intensity.min, gaugeLimits.intensity.max);

          isPaddling = true;

          clearTimeout(strokeTimeout);
          strokeTimeout = setTimeout(() => {
            isPaddling = false;
            document.getElementById('spmDisplay').innerText = '0';
            updateGauge('spmGauge', 0, gaugeLimits.spm.min, gaugeLimits.spm.max);
            document.getElementById('speedInstDisplay').innerText = '0.0';
            updateGauge('speedInstGauge', 0, gaugeLimits.speedInst.min, gaugeLimits.speedInst.max);
          }, 3500);

          if (lastStrokeTime > 0) {
            const instantSPM = Math.round(60000 / timeDiff);
            document.getElementById('spmDisplay').innerText = instantSPM;
            updateGauge('spmGauge', instantSPM, gaugeLimits.spm.min, gaugeLimits.spm.max);
          }

          lastStrokeTime = currentTime;
        }
      }
    }

    window.onload = initChart;
  </script>
</body>
</html>
